<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Contacts Manager</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        body {
            font-family: 'Inter', sans-serif;
        }

        /* Custom Scrollbar for better aesthetics */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        /* Input autofill styling override */
        input:-webkit-autofill {
            -webkit-box-shadow: 0 0 0 30px white inset !important;
        }
    </style>
</head>

<body class="bg-brand-50 text-slate-800 antialiased min-h-screen">

  <!-- INCLUDE navigation.html -->

  <!-- Layout Wrapper with Left Sidebar Offset -->
  <div class="lg:pl-64 pt-16 lg:pt-0">
    <!-- Main Container -->
    <div class="max-w-5xl mx-auto p-4 sm:p-6 lg:p-8">

        <!-- Header -->
        <header class="mb-8 flex items-center gap-4">
            <div class="bg-blue-600 text-white p-3 rounded-2xl shadow-lg shadow-blue-600/20">
                <i data-lucide="contact" class="w-7 h-7"></i>
            </div>
            <div>
                <h1 class="text-3xl font-bold text-slate-900 tracking-tight">Contacts</h1>
                <p class="text-sm text-slate-500 mt-1">Manage your network efficiently</p>
            </div>
        </header>

        <!-- Add Contact Form Card -->
        <div
            class="bg-white rounded-2xl shadow-sm border border-slate-100 p-5 sm:p-6 mb-8 transition-shadow hover:shadow-md">
            <form id="create-form" class="flex flex-col sm:flex-row gap-4 items-end sm:items-center">

                <div class="w-full sm:flex-1 relative">
                    <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2"
                        for="name">Name</label>
                    <div class="relative">
                        <div
                            class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                            <i data-lucide="user" class="w-4 h-4"></i>
                        </div>
                        <input id="name" placeholder="John Doe" required
                            class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 focus:border-blue-500 focus:bg-white focus:ring-2 focus:ring-blue-100 rounded-xl text-slate-900 text-sm transition-all outline-none" />
                    </div>
                </div>

                <div class="w-full sm:flex-1 relative">
                    <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2"
                        for="ph_number">Phone Number</label>
                    <div class="relative">
                        <div
                            class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                            <i data-lucide="phone" class="w-4 h-4"></i>
                        </div>
                        <input id="ph_number" placeholder="e.g. 12345678901" required pattern="\d{10,15}"
                            title="Please enter a valid phone number"
                            class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 focus:border-blue-500 focus:bg-white focus:ring-2 focus:ring-blue-100 rounded-xl text-slate-900 text-sm transition-all outline-none" />
                    </div>
                </div>

                <div class="w-full sm:w-auto">
                    <button type="submit"
                        class="w-full sm:w-auto flex items-center justify-center gap-2 px-6 py-2.5 bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium rounded-xl shadow-sm shadow-blue-600/30 transition-all active:scale-95 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
                        <i data-lucide="plus" class="w-4 h-4"></i>
                        <span>Add Contact</span>
                    </button>
                </div>
            </form>
        </div>

        <!-- Contacts List Card -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">

            <!-- List Header / Instructions -->
            <div class="px-5 py-4 border-b border-slate-100 flex items-center justify-between bg-slate-50/50">
                <h2 class="text-base font-semibold text-slate-800 flex items-center gap-2">
                    <i data-lucide="list" class="w-4 h-4 text-slate-400"></i>
                    Directory
                </h2>
                <span
                    class="text-xs font-medium text-slate-500 bg-white px-2.5 py-1 rounded-md border border-slate-200">
                    Tap fields to edit
                </span>
            </div>

            <!-- Desktop Table Header (Hidden on Mobile) -->
            <div
                class="hidden sm:grid grid-cols-[60px_minmax(0,1fr)_minmax(0,1fr)_100px_140px] gap-4 px-6 py-3 bg-slate-50 border-b border-slate-100">
                <div class="text-xs font-semibold text-slate-500 uppercase tracking-wider">ID</div>
                <div class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Name</div>
                <div class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Phone</div>
                <div class="text-xs font-semibold text-slate-500 uppercase tracking-wider text-center">Status</div>
                <div class="text-xs font-semibold text-slate-500 uppercase tracking-wider text-right">Actions</div>
            </div>

            <!-- Contacts Container (Populated by JS) -->
            <div id="contacts-container" class="divide-y divide-slate-100">
                <!-- Loading Skeleton -->
                <div class="p-8 text-center text-slate-400 flex flex-col items-center justify-center">
                    <i data-lucide="loader-2" class="w-8 h-8 animate-spin mb-3 text-blue-500"></i>
                    <p class="text-sm font-medium">Loading contacts...</p>
                </div>
            </div>

        </div>
    </div>

    <!-- Custom Delete Confirmation Modal -->
    <div id="delete-modal" class="fixed inset-0 z-50 hidden items-center justify-center">
        <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-sm transition-opacity" onclick="closeDeleteModal()">
        </div>
        <div class="bg-white rounded-2xl shadow-2xl border border-slate-100 p-6 max-w-sm w-full mx-4 relative z-10 transform scale-95 opacity-0 transition-all duration-200"
            id="delete-modal-content">
            <div class="flex items-center gap-4 mb-4">
                <div class="bg-red-50 text-red-600 p-3 rounded-full shrink-0">
                    <i data-lucide="alert-triangle" class="w-6 h-6"></i>
                </div>
                <div>
                    <h3 class="text-lg font-bold text-slate-900">Delete Contact</h3>
                    <p class="text-slate-500 text-sm mt-1">This action cannot be undone.</p>
                </div>
            </div>
            <div class="flex justify-end gap-3 mt-8">
                <button onclick="closeDeleteModal()"
                    class="px-4 py-2 text-sm font-medium text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-xl transition-colors focus:outline-none focus:ring-2 focus:ring-slate-300">
                    Cancel
                </button>
                <button id="confirm-delete-btn"
                    class="px-4 py-2 text-sm font-medium text-white bg-red-600 hover:bg-red-700 rounded-xl shadow-sm shadow-red-600/20 transition-all active:scale-95 focus:outline-none focus:ring-2 focus:ring-red-500 focus:ring-offset-2">
                    Yes, Delete
                </button>
            </div>
        </div>
    </div>

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2"></div>

    <script>
        // --- Mock Backend Interceptor for Preview Reliability ---
        // This allows your exact fetch URLs to work in this isolated canvas environment
        // by falling back to localStorage if your actual backend isn't reachable.
        const originalFetch = window.fetch;
        window.fetch = async (url, options = {}) => {
            try {
                const res = await originalFetch(url, options);
                if (res.ok || res.status !== 404) return res;
            } catch (e) { /* Network error, proceed to mock */ }

            // Fallback Mock Logic
            return new Promise(resolve => {
                setTimeout(() => {
                    let data = JSON.parse(localStorage.getItem('mockContacts') || '[]');
                    if (data.length === 0 && !localStorage.getItem('mockInit')) {
                        data = [
                            { id: 101, name: "Alice Smith", ph_number: "09123456789", enable: true },
                            { id: 102, name: "Bob Jones", ph_number: "09987654321", enable: false }
                        ];
                        localStorage.setItem('mockInit', 'true');
                    }

                    let resData = null;
                    const method = options.method || 'GET';

                    if (url === '/contacts' && method === 'GET') {
                        resData = data;
                    } else if (url === '/contacts' && method === 'POST') {
                        const body = JSON.parse(options.body);
                        const newContact = { id: Math.floor(Math.random() * 1000) + 200, ...body, enable: true };
                        data.push(newContact);
                        resData = newContact;
                    } else if (url.match(/\/contacts\/(\d+)\/enable/) && method === 'PATCH') {
                        const id = parseInt(url.split('/')[2]);
                        const enable = new URLSearchParams(url.split('?')[1]).get('enable') === 'true';
                        const idx = data.findIndex(c => c.id === id);
                        if (idx > -1) data[idx].enable = enable;
                        resData = { success: true };
                    } else if (url.match(/\/contacts\/(\d+)/) && method === 'PUT') {
                        const id = parseInt(url.split('/')[2]);
                        const body = JSON.parse(options.body);
                        const idx = data.findIndex(c => c.id === id);
                        if (idx > -1) { data[idx].name = body.name; data[idx].ph_number = body.ph_number; }
                        resData = { success: true };
                    } else if (url.match(/\/contacts\/(\d+)/) && method === 'DELETE') {
                        const id = parseInt(url.split('/')[2]);
                        data = data.filter(c => c.id !== id);
                        resData = { success: true };
                    }

                    localStorage.setItem('mockContacts', JSON.stringify(data));
                    resolve({ ok: true, json: async () => resData });
                }, 300); // Simulate network latency
            });
        };
        // --------------------------------------------------------

        // Initialize Lucide Icons
        lucide.createIcons();

        // Toast Notification System
        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');

            const colors = type === 'success'
                ? 'bg-emerald-50 text-emerald-800 border-emerald-200'
                : 'bg-red-50 text-red-800 border-red-200';
            const icon = type === 'success' ? 'check-circle' : 'alert-circle';

            toast.className = `flex items-center gap-3 px-4 py-3 rounded-xl border shadow-lg transform transition-all duration-300 translate-y-10 opacity-0 ${colors}`;
            toast.innerHTML = `
        <i data-lucide="${icon}" class="w-5 h-5"></i>
        <span class="text-sm font-medium">${message}</span>
      `;

            container.appendChild(toast);
            lucide.createIcons({ root: toast });

            // Animate in
            requestAnimationFrame(() => {
                toast.classList.remove('translate-y-10', 'opacity-0');
            });

            // Animate out and remove
            setTimeout(() => {
                toast.classList.add('translate-y-10', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // Modal State
        let pendingDeleteId = null;

        function openDeleteModal(id) {
            pendingDeleteId = id;
            const modal = document.getElementById('delete-modal');
            const content = document.getElementById('delete-modal-content');
            modal.classList.remove('hidden');
            modal.classList.add('flex');

            // Animate in
            requestAnimationFrame(() => {
                content.classList.remove('scale-95', 'opacity-0');
                content.classList.add('scale-100', 'opacity-100');
            });
        }

        function closeDeleteModal() {
            const modal = document.getElementById('delete-modal');
            const content = document.getElementById('delete-modal-content');

            // Animate out
            content.classList.remove('scale-100', 'opacity-100');
            content.classList.add('scale-95', 'opacity-0');

            setTimeout(() => {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
                pendingDeleteId = null;
            }, 200);
        }

        // Modal Confirm Action
        document.getElementById('confirm-delete-btn').onclick = async () => {
            if (!pendingDeleteId) return;
            const id = pendingDeleteId;
            closeDeleteModal();

            await fetch(`/contacts/${id}`, { method: 'DELETE' });
            showToast('Contact deleted successfully');
            fetchContacts();
        };

        // Main App Logic
        async function fetchContacts() {
            const res = await fetch('/contacts');
            const data = await res.json();
            const container = document.getElementById('contacts-container');

            if (data.length === 0) {
                container.innerHTML = `
          <div class="p-10 text-center text-slate-500">
            <i data-lucide="users-2" class="w-12 h-12 mx-auto text-slate-300 mb-3"></i>
            <p class="text-sm font-medium">No contacts found. Add one above!</p>
          </div>
        `;
                lucide.createIcons();
                return;
            }

            container.innerHTML = '';

            data.forEach(c => {
                const escapedName = (c.name || '').replace(/"/g, '&quot;');
                const escapedPhone = (c.ph_number || '').replace(/"/g, '&quot;');

                const row = document.createElement('div');
                row.className = 'group flex flex-col sm:grid sm:grid-cols-[60px_minmax(0,1fr)_minmax(0,1fr)_100px_140px] gap-4 sm:gap-4 items-start sm:items-center p-5 sm:px-6 sm:py-4 transition-colors hover:bg-slate-50/80';

                row.innerHTML = `
          <!-- ID Badge (Mobile) / Text (Desktop) -->
          <div class="flex items-center w-full sm:w-auto justify-between sm:justify-start">
            <span class="sm:hidden text-xs font-semibold text-slate-400 uppercase tracking-wider">ID</span>
            <span class="text-sm font-medium text-slate-400 bg-slate-100 sm:bg-transparent px-2 py-0.5 sm:p-0 rounded-md">#${c.id}</span>
          </div>

          <!-- Name Input -->
          <div class="w-full">
            <label class="sm:hidden text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1 block">Name</label>
            <div class="relative">
              <input data-id-name="${c.id}" value="${escapedName}" 
                     class="w-full bg-transparent border border-transparent hover:border-slate-300 focus:border-blue-500 focus:bg-white focus:ring-4 focus:ring-blue-500/10 rounded-lg px-3 py-2 text-slate-900 text-sm font-medium transition-all outline-none" />
              <i data-lucide="edit-3" class="w-3.5 h-3.5 absolute right-3 top-1/2 -translate-y-1/2 text-slate-300 opacity-0 group-hover:opacity-100 pointer-events-none transition-opacity"></i>
            </div>
          </div>

          <!-- Phone Input -->
          <div class="w-full">
            <label class="sm:hidden text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1 block">Phone</label>
            <div class="relative">
              <input data-id-phone="${c.id}" value="${escapedPhone}" 
                     class="w-full bg-transparent border border-transparent hover:border-slate-300 focus:border-blue-500 focus:bg-white focus:ring-4 focus:ring-blue-500/10 rounded-lg px-3 py-2 text-slate-600 text-sm transition-all outline-none" />
              <i data-lucide="edit-3" class="w-3.5 h-3.5 absolute right-3 top-1/2 -translate-y-1/2 text-slate-300 opacity-0 group-hover:opacity-100 pointer-events-none transition-opacity"></i>
            </div>
          </div>

          <!-- Status Toggle -->
          <div class="w-full sm:w-auto flex items-center justify-between sm:justify-center">
            <label class="sm:hidden text-xs font-semibold text-slate-400 uppercase tracking-wider">Status</label>
            <label class="relative inline-flex items-center cursor-pointer group/toggle" title="Toggle Status">
              <input type="checkbox" class="sr-only peer enable-switch" data-id-enable="${c.id}" ${c.enable ? 'checked' : ''}>
              <div class="w-11 h-6 bg-slate-200 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-blue-100 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-emerald-500 group-hover/toggle:shadow-sm"></div>
            </label>
          </div>

          <!-- Actions -->
          <div class="w-full sm:w-auto flex items-center justify-end gap-2 mt-2 sm:mt-0 pt-4 sm:pt-0 border-t border-slate-100 sm:border-t-0">
            <button class="flex-1 sm:flex-none flex items-center justify-center gap-1.5 px-3 py-2 text-sm font-medium text-blue-600 hover:text-blue-700 hover:bg-blue-50 bg-slate-50 sm:bg-transparent rounded-lg transition-colors focus:outline-none focus:ring-2 focus:ring-blue-100" data-action="save" data-id="${c.id}">
              <i data-lucide="save" class="w-4 h-4"></i> <span class="sm:hidden lg:inline">Save</span>
            </button>
            <button class="flex items-center justify-center gap-1.5 px-3 py-2 text-sm font-medium text-red-600 hover:text-red-700 hover:bg-red-50 bg-slate-50 sm:bg-transparent rounded-lg transition-colors focus:outline-none focus:ring-2 focus:ring-red-100" data-action="delete" data-id="${c.id}" title="Delete Contact">
              <i data-lucide="trash-2" class="w-4 h-4"></i>
            </button>
          </div>
        `;
                container.appendChild(row);
            });

            lucide.createIcons();
            attachHandlers();
        }

        function attachHandlers() {
            // Toggle Enable/Disable
            document.querySelectorAll('.enable-switch').forEach(el => {
                el.onchange = async () => {
                    const id = el.getAttribute('data-id-enable');
                    const enabled = el.checked;
                    await fetch(`/contacts/${id}/enable?enable=${enabled}`, { method: 'PATCH' });
                    showToast(`Contact ${enabled ? 'enabled' : 'disabled'}`);
                    // Don't need to re-fetch the whole list just for a toggle, keeps UI smooth
                };
            });

            // Save Edits
            document.querySelectorAll('button[data-action="save"]').forEach(btn => {
                btn.onclick = async (ev) => {
                    ev.preventDefault();
                    const id = btn.getAttribute('data-id');

                    // Add brief loading state to button
                    const originalHTML = btn.innerHTML;
                    btn.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i>`;
                    lucide.createIcons({ root: btn });

                    const name = document.querySelector(`input[data-id-name="${id}"]`).value;
                    const phone = document.querySelector(`input[data-id-phone="${id}"]`).value;
                    const payload = { name, ph_number: phone };

                    await fetch(`/contacts/${id}`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });

                    btn.innerHTML = originalHTML;
                    lucide.createIcons({ root: btn });
                    showToast('Changes saved successfully');
                };
            });

            // Trigger Delete Modal
            document.querySelectorAll('button[data-action="delete"]').forEach(btn => {
                btn.onclick = (ev) => {
                    ev.preventDefault();
                    const id = btn.getAttribute('data-id');
                    openDeleteModal(id);
                };
            });
        }

        // Add New Contact
        document.getElementById('create-form').onsubmit = async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            const originalHTML = btn.innerHTML;
            btn.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> <span>Saving...</span>`;
            lucide.createIcons({ root: btn });

            const name = document.getElementById('name').value.trim();
            const ph = document.getElementById('ph_number').value.trim();

            await fetch('/contacts', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name, ph_number: ph }) });

            document.getElementById('name').value = '';
            document.getElementById('ph_number').value = '';

            btn.innerHTML = originalHTML;
            lucide.createIcons({ root: btn });

            showToast('New contact added');
            fetchContacts();
        };

        // Initial Load
        fetchContacts();
    </script>
  </div>
</body>

</html>
