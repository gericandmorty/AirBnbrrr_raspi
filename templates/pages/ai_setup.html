<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AirBnBrrr - AI Predictor Setup</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
            colors: {
              brand: {
                50: '#f6fbf8',
                100: '#eef7f1',
                500: '#22c55e',
                600: '#0b6b2b',
                700: '#095924',
                800: '#3b6b52',
                900: '#062b12',
              }
            }
          }
        }
      }
    </script>
</head>

<body class="bg-brand-50 min-h-screen font-sans antialiased text-slate-800">

  <!-- INCLUDE navigation.html -->

  <!-- Layout Wrapper with Left Sidebar Offset -->
  <div class="lg:pl-64 pt-16 lg:pt-0">
    <!-- Centered Flex Wrapper under Navbar -->
    <div class="flex items-center justify-center p-4 sm:p-8 min-h-[calc(100vh-4rem)]">
      <main class="w-full max-w-2xl bg-white rounded-2xl shadow-lg border border-slate-200 overflow-hidden">
        <div class="bg-brand-600 px-6 py-5 text-white flex items-center gap-3">
            <i data-lucide="sparkles" class="w-6 h-6"></i>
            <h1 class="text-2xl font-bold tracking-tight">AI Setup</h1>
        </div>

        <div class="p-6 sm:p-8">
            <form id="aiForm" class="space-y-6">
                <div>
                    <label for="api_url" class="block text-sm font-semibold text-slate-700 mb-2">API URL</label>
                    <input id="api_url" name="api_url" type="url" placeholder="https://api.cerebras.ai/v1/chat/completions"
                        class="block w-full rounded-xl border-slate-300 bg-slate-50 py-3 px-4 text-slate-900 border focus:border-brand-600 focus:bg-white focus:ring-2 focus:ring-brand-100 focus:outline-none transition-colors duration-200" />
                </div>

                <div>
                    <label for="api_key" class="block text-sm font-semibold text-slate-700 mb-2">API Key</label>
                    <input id="api_key" name="api_key" type="text" placeholder="Paste your AI provider API key"
                        class="block w-full rounded-xl border-slate-300 bg-slate-50 py-3 px-4 text-slate-900 border focus:border-brand-600 focus:bg-white focus:ring-2 focus:ring-brand-100 focus:outline-none transition-colors duration-200" />
                </div>

                <div>
                    <label for="model" class="block text-sm font-semibold text-slate-700 mb-2">Model</label>
                    <input id="model" name="model" type="text" placeholder="zai-glm-4.7"
                        class="block w-full rounded-xl border-slate-300 bg-slate-50 py-3 px-4 text-slate-900 border focus:border-brand-600 focus:bg-white focus:ring-2 focus:ring-brand-100 focus:outline-none transition-colors duration-200" />
                </div>

                <div class="pt-4 flex flex-col sm:flex-row gap-3 items-center">
                    <button
                        class="w-full sm:w-auto flex-1 bg-brand-600 hover:bg-brand-700 text-white font-semibold py-3 px-5 rounded-xl transition-colors duration-200 shadow-sm flex items-center justify-center gap-2 cursor-pointer border-0"
                        type="submit">
                        Save Settings
                    </button>
                    <button
                        class="w-full sm:w-auto bg-white hover:bg-slate-50 text-slate-700 font-semibold py-3 px-5 rounded-xl border border-slate-300 transition-colors duration-200 shadow-sm cursor-pointer"
                        type="button" id="refresh">
                        Refresh
                    </button>
                </div>

                <div class="text-center text-sm font-medium min-h-[1.25rem] transition-all" id="status"></div>
            </form>

            <hr class="border-slate-200 my-8">

            <div class="bg-brand-50 border border-brand-100 rounded-2xl p-5 text-sm text-brand-900">
                <p class="font-semibold mb-2">How this works</p>
                <ul class="list-disc pl-5 space-y-1 text-brand-800">
                    <li>Values saved here are stored in your local database.</li>
                    <li>The AI predictor reads this setup every time it sends a request.</li>
                    <li>You can switch provider URL, API key, and model without changing code.</li>
                </ul>
            </div>
        </div>
    </main>
  </div>

    <script>
        const statusEl = document.getElementById('status');
        const aiForm = document.getElementById('aiForm');

        async function load() {
            statusEl.textContent = '';
            try {
                const res = await fetch('/ai_setup');
                if (!res.ok) throw new Error('Failed to load settings');
                const j = await res.json();

                document.getElementById('api_url').value = j.api_url || '';
                document.getElementById('api_key').value = j.api_key || '';
                document.getElementById('model').value = j.model || '';
            } catch (err) {
                statusEl.style.color = '#ef4444';
                statusEl.textContent = 'Error loading settings';
            }
        }

        aiForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            statusEl.style.color = '#334155';
            statusEl.textContent = 'Saving...';

            const payload = {
                api_url: document.getElementById('api_url').value,
                api_key: document.getElementById('api_key').value,
                model: document.getElementById('model').value
            };

            try {
                const res = await fetch('/ai_setup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                if (!res.ok) throw new Error('Save failed');

                statusEl.style.color = '#10b981';
                statusEl.textContent = 'Settings successfully saved!';

                setTimeout(() => {
                    if (statusEl.textContent === 'Settings successfully saved!') {
                        statusEl.textContent = '';
                    }
                }, 3000);
            } catch (err) {
                statusEl.style.color = '#ef4444';
                statusEl.textContent = 'Error saving settings';
            }
        });

        document.getElementById('refresh').addEventListener('click', load);
        window.addEventListener('load', load);
    </script>
    </div>
  </div>
</body>

</html>
