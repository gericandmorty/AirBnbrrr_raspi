<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AirBnBrrr Dashboard</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Tailwind Configuration matching your brand colors -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f3fafb',  // Ice Mint Tint background
                            100: '#C1E6EC', // Ice Mint
                            500: '#4b6b80', // Muted slate blue text
                            600: '#62B6DC', // Pastel Slate Blue
                            700: '#1E6AA6', // Deep Cold Blue primary
                            800: '#185585', // Medium Cold Blue hover
                            900: '#0b1d30', // Dark Navy text
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        body {
            background-color: theme('colors.brand.50');
            color: theme('colors.brand.900');
            -webkit-font-smoothing: antialiased;
        }

        /* Pulse animation for the live status dot */
        @keyframes pulse-ring {
            0% {
                transform: scale(0.8);
                box-shadow: 0 0 0 0 rgba(30, 106, 166, 0.7);
            }

            70% {
                transform: scale(1);
                box-shadow: 0 0 0 6px rgba(30, 106, 166, 0);
            }

            100% {
                transform: scale(0.8);
                box-shadow: 0 0 0 0 rgba(30, 106, 166, 0);
            }
        }

        .status-dot-live {
            animation: pulse-ring 2s infinite;
        }

        /* Value update transition */
        .value-text {
            transition: color 0.3s ease;
        }

        .value-updated {
            color: theme('colors.brand.700');
        }
    </style>
</head>

<body class="min-h-screen selection:bg-brand-100 selection:text-brand-900 bg-brand-50">

  <!-- INCLUDE navigation.html -->

  <!-- Layout Wrapper with Left Sidebar Offset -->
  <div class="lg:pl-64 pt-16 lg:pt-0">
    <div class="max-w-7xl mx-auto p-4 sm:p-6 lg:p-8">

        <!-- Header Section -->
        <header class="mb-8 flex flex-col sm:flex-row sm:items-end justify-between gap-4">
            <div>
                <div class="flex items-center gap-3 mb-1">
                    <div class="p-2 bg-brand-700 rounded-lg shadow-sm">
                        <i data-lucide="snowflake" class="w-6 h-6 text-white"></i>
                    </div>
                    <h1 class="text-3xl font-bold tracking-tight text-brand-900">AirBnBrrr</h1>
                </div>
                <p class="text-brand-500 font-medium ml-1">AC Telemetry & Performance Dashboard</p>
            </div>

            <!-- Controls -->
            <div
                class="flex flex-wrap items-center gap-3 sm:gap-4 bg-white p-2 sm:p-3 rounded-2xl border border-gray-100 shadow-sm">
                <!-- AC Selector -->
                <div class="flex items-center gap-2">
                    <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">Unit:</span>
                    <select id="ac-selector" class="text-xs font-semibold bg-slate-50 text-slate-600 hover:text-slate-800 border border-slate-200 rounded-xl px-3 py-1.5 focus:outline-none focus:ring-2 focus:ring-brand-200 cursor-pointer">
                        <option value="telemetry">Telemetry</option>
                        <option value="AC1">AC1 (Good condition)</option>
                        <option value="AC2">AC2 (Good condition)</option>
                        <option value="AC3">AC3 (Compressor Overheat)</option>
                        <option value="AC4">AC4 (Excessive Vibration & Dust Accumulation)</option>
                        <option value="AC5">AC5 (Reduced Cooling Performance)</option>
                        <option value="AC6">AC6 (Good condition)</option>
                    </select>
                </div>
                <div class="w-px h-6 bg-gray-200 hidden sm:block"></div>

                <div class="flex items-center gap-2 px-3 py-1 rounded-full bg-slate-50 border border-slate-100"
                    id="status-container">
                    <span class="status-dot w-2.5 h-2.5 rounded-full bg-gray-400 block" id="status-indicator"></span>
                    <span class="text-xs font-semibold text-slate-600 uppercase tracking-wider"
                        id="status-text">Connecting</span>
                </div>

                <div class="w-px h-6 bg-gray-200 hidden sm:block"></div>

                <a href="/pages/real_time_graphs"
                    class="flex items-center gap-2 text-sm font-medium text-brand-700 bg-brand-50 hover:bg-brand-100 px-4 py-2 rounded-xl transition-colors">
                    <i data-lucide="line-chart" class="w-4 h-4"></i>
                    <span class="hidden xs:inline">Real-time</span> Graphs
                </a>

                <button id="refresh"
                    class="flex items-center gap-2 text-sm font-medium text-white bg-brand-700 hover:bg-brand-800 active:bg-brand-900 px-4 py-2 rounded-xl shadow-sm transition-all hover:shadow focus:ring-2 focus:ring-brand-700 focus:ring-offset-2 focus:outline-none">
                    <i data-lucide="refresh-cw" class="w-4 h-4" id="refresh-icon"></i>
                    Refresh
                </button>
            </div>
        </header>

        <!-- Cards Grid -->
        <div id="cards" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 sm:gap-6">
            <!-- Cards injected by JS -->
        </div>

    </div>

    <script>
        // 1. Configuration for metrics (Labels, Icons, Units)
        const metricConfig = {
            timestamp: { label: 'Last Updated', icon: 'clock', unit: '' },
            dust_sensor: { label: 'Air Quality (Dust)', icon: 'wind', unit: ' µg/m³' },
            dht_temp: { label: 'AC Output Temp', icon: 'thermometer', unit: '°C' },
            dht_humidity: { label: 'AC Output Humidity', icon: 'droplets', unit: '%' },
            vibration: { label: 'Compressor Vibration', icon: 'activity', unit: ' hz' },
            ds18b20_temp1: { label: 'Compressor Outlet Temp', icon: 'thermometer-sun', unit: '°C' },
            ds18b20_temp2: { label: 'Compressor Inlet Temp', icon: 'thermometer-snowflake', unit: '°C' },
            pzem_voltage: { label: 'Voltage', icon: 'zap', unit: ' V' },
            pzem_current: { label: 'Current', icon: 'plug-zap', unit: ' A' },
            pzem_power: { label: 'Active Power', icon: 'power', unit: ' W' },
            pzem_energy: { label: 'Daily Energy', icon: 'battery-charging', unit: ' kWh' },
            pzem_frequency: { label: 'Frequency', icon: 'radio', unit: ' Hz' },
            pzem_power_factor: { label: 'Power Factor', icon: 'percent', unit: '' },
            ac_status: { label: 'AC Status', icon: 'power-circle', unit: '' },
            ac_thermostat: { label: 'AC Thermostat', icon: 'sliders', unit: '°C' }
        };

        const columns = [
            'timestamp', 'dust_sensor', 'dht_temp', 'dht_humidity', 'vibration',
            'ds18b20_temp2', 'ds18b20_temp1',
            'pzem_voltage', 'pzem_current',
            'pzem_power', 'pzem_energy', 'pzem_frequency', 'pzem_power_factor'
        ];

        const cardsEl = document.getElementById('cards');

        // Formatter
        function nice(v) {
            if (v === null || v === undefined) return '—';
            if (typeof v === 'number') return Number(v).toFixed(2);
            return String(v);
        }

        // Generate Card HTML
        function makeCard(key) {
            const config = metricConfig[key] || { label: key, icon: 'info', unit: '' };
            const isTimestamp = key === 'timestamp';

            const c = document.createElement('div');

            if (isTimestamp) {
                // Special prominent styling for Timestamp card
                c.className = 'col-span-full bg-brand-900 text-white rounded-2xl p-5 sm:p-6 shadow-lg flex flex-col sm:flex-row sm:items-center justify-between gap-4 border border-brand-700/50 relative overflow-hidden';
                c.id = 'card-' + key;

                // Add a decorative background icon
                c.innerHTML = `
                    <i data-lucide="server" class="absolute -right-4 -bottom-6 w-32 h-32 text-white opacity-5"></i>
                    <div class="flex items-center gap-4 relative z-10">
                        <div class="p-3 bg-white/10 rounded-xl backdrop-blur-sm">
                            <i data-lucide="${config.icon}" class="w-6 h-6 text-brand-100"></i>
                        </div>
                        <div>
                            <div class="text-brand-100/70 text-sm font-medium mb-1 uppercase tracking-wider">${config.label}</div>
                            <div class="v text-2xl sm:text-3xl font-bold text-white tracking-tight value-text" data-key="${key}">—</div>
                        </div>
                    </div>
                `;
            } else {
                // Standard card styling
                c.className = 'bg-white rounded-2xl p-5 shadow-sm border border-slate-100 hover:shadow-md hover:border-brand-100 transition-all duration-300 flex flex-col justify-between gap-4 group';
                c.id = 'card-' + key;

                c.innerHTML = `
                    <div class="flex items-start justify-between">
                        <div class="p-2.5 bg-slate-50 text-slate-500 group-hover:bg-brand-50 group-hover:text-brand-700 rounded-xl transition-colors">
                            <i data-lucide="${config.icon}" class="w-5 h-5"></i>
                        </div>
                    </div>
                    <div>
                        <div class="text-slate-500 text-sm font-medium mb-1 line-clamp-1" title="${config.label}">${config.label}</div>
                        <div class="flex items-baseline gap-1">
                            <span class="v text-2xl font-bold text-slate-800 tracking-tight value-text" data-key="${key}">—</span>
                            <span class="text-slate-400 font-medium text-sm">${config.unit}</span>
                        </div>
                    </div>
                `;
            }
            return c;
        }

        function renderEmpty() {
            cardsEl.innerHTML = '';
            for (const k of columns) {
                cardsEl.appendChild(makeCard(k));
            }
            lucide.createIcons(); // Initialize icons
        }

        // Update UI logic
        function updateStatus(state) {
            const dot = document.getElementById('status-indicator');
            const text = document.getElementById('status-text');

            if (state === 'live') {
                dot.className = 'status-dot w-2 h-2 rounded-full bg-brand-500 block status-dot-live';
                text.textContent = 'Live Data';
                text.className = 'text-xs font-bold text-brand-700 uppercase tracking-wider';
            } else if (state === 'mock') {
                dot.className = 'status-dot w-2 h-2 rounded-full bg-amber-500 block';
                text.textContent = 'Preview Mode';
                text.className = 'text-xs font-bold text-amber-600 uppercase tracking-wider';
            } else {
                dot.className = 'status-dot w-2 h-2 rounded-full bg-red-500 block';
                text.textContent = 'Offline';
                text.className = 'text-xs font-bold text-red-600 uppercase tracking-wider';
            }
        }

        function updateCards(data) {
            if (!data) return;
            for (const k of columns) {
                const sel = document.querySelector(`#card-${k} .v`);
                if (!sel) continue;

                const newVal = nice(data[k]);

                // Only update and animate if value changed
                if (sel.textContent !== newVal) {
                    sel.textContent = newVal;

                    // Trigger visual flash on update (except for timestamp to avoid visual noise)
                    if (k !== 'timestamp') {
                        sel.classList.remove('value-updated');
                        void sel.offsetWidth; // trigger reflow
                        sel.classList.add('value-updated');
                        setTimeout(() => sel.classList.remove('value-updated'), 400);
                    }
                }
            }
        }

        // Mock Data Generator (for visual preview without a backend)
        function generateMockData() {
            return {
                timestamp: new Date().toLocaleTimeString(),
                dust_sensor: (Math.random() * 5 + 10),
                dht_temp: (Math.random() * 2 + 18),
                dht_humidity: (Math.random() * 5 + 40),
                vibration: Math.floor(Math.random() * 100 + 1000),
                ds18b20_temp1: (Math.random() * 2 + 12),
                ds18b20_temp2: (Math.random() * 5 + 60),
                pzem_voltage: (Math.random() * 4 + 218),
                pzem_current: (Math.random() * 1 + 5),
                pzem_power: (Math.random() * 200 + 1000),
                pzem_energy: 150.2 + (Math.random() * 0.1),
                pzem_frequency: (Math.random() * 0.2 + 59.9),
                pzem_power_factor: 0.95
            };
        }

        let activeAC = localStorage.getItem('data_gathered_active_ac') || 'AC2';
        const acSelector = document.getElementById('ac-selector');
        if (acSelector) {
            acSelector.value = activeAC;
            acSelector.addEventListener('change', (e) => {
                activeAC = e.target.value;
                localStorage.setItem('data_gathered_active_ac', activeAC);
                fetchLatest();
            });
        }

        // Fetch Data
        async function fetchLatest() {
            const refreshIcon = document.getElementById('refresh-icon');
            refreshIcon.classList.add('animate-spin');

            try {
                const res = await fetch(`/telemetry/latest?ac_unit=${encodeURIComponent(activeAC)}`);
                if (!res.ok) throw new Error('no data');
                const j = await res.json();
                updateCards(j);
                updateStatus('live');
            } catch (err) {
                console.error("Failed to load real telemetry:", err);
                renderEmpty();
                updateStatus('offline');
            } finally {
                setTimeout(() => refreshIcon.classList.remove('animate-spin'), 500);
            }
        }

        // Initialization
        renderEmpty();
        fetchLatest();

        // Polling (Every 5 seconds instead of 10 for better preview feedback)
        const intervalId = setInterval(fetchLatest, 5000);

        // Event Listeners
        document.getElementById('refresh').addEventListener('click', fetchLatest);
        window.addEventListener('beforeunload', () => clearInterval(intervalId));
    </script>
  </div>
</body>

</html>
